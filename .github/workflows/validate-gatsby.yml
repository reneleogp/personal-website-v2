name: Validate Gatsby

on:
  push:
    branches:
      - v3-refresh
  pull_request:
    branches:
      - v3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build site
        run: yarn build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: gatsby-public
          path: public
          if-no-files-found: error
          retention-days: 7
